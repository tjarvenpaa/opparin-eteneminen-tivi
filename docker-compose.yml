# Docker Compose file
# version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tivi-oppari-lomake
    ports:
      - "8081:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
